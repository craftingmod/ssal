[package]
name = "ssal"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
phase2c-diagnostic = []
phase3-diagnostic = ["phase2c-diagnostic"]

[[bin]]
name = "ssal"
path = "src/ssal.rs"

[[bin]]
name = "ssald"
path = "src/ssald.rs"

[dependencies]
libc = "0.2.191"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rsproperties = { version = "=0.7.0", features = ["builder", "strict-file-validation"] }
prost = "0.14"
