[package]
name = "ssal-rsbinder-phase3"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "phase3-ipc"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
libc = "=0.2.191"
rsbinder = { version = "=0.12.0", default-features = false, features = ["android_16_plus"] }
serde_json = "=1.0.154"

[build-dependencies]
rsbinder-aidl = "=0.12.0"
