[package]
name = "ssal-thermal"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ssal-binder-service = { path = "../binder-service" }
rsbinder = { version = "=0.13.0", default-features = false, features = ["android_14_plus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
rsbinder-aidl = "=0.13.0"
